# voxmd configuration
#
# Copy to ~/.config/voxmd/config.yaml (or ./voxmd.yaml) and edit.
# Your real config is gitignored: it holds local paths.
#
# transcribe, extract and render work without a config file. `voxmd process`
# needs vault.path (or --vault). Run `voxmd doctor` to check everything.

whisper:
  # Homebrew's whisper-cpp installs `whisper-cli`. Use an absolute path for a
  # custom build.
  binary: whisper-cli

  # ggml weights. A 1.6 GB manual download; see setup.md.
  model: ~/.local/share/voxmd/models/ggml-large-v3-turbo.bin

  # ISO code such as `en`, or `auto` to detect per memo.
  language: auto

  # Omit to use the performance-core count, which is faster than using every
  # core on Apple Silicon.
  # threads: 4

ollama:
  # Must be loopback (127.0.0.1, ::1, or localhost). Anything else is refused:
  # transcripts never leave this machine.
  host: http://127.0.0.1:11434

  # Pull it first: `ollama pull qwen3:8b`
  model: qwen3:8b

  # Low, so the extraction stays faithful to what was said.
  temperature: 0.1

  # Context window ceiling in tokens. Each memo gets the smallest window that
  # fits it, up to this. Longer transcripts are cut to fit, with a warning.
  num_ctx: 16384

  # Longest reply, in tokens.
  num_predict: 2048

  # Not configurable, by design: the model is always unloaded after each call
  # (keep_alive 0) and thinking is always off.

render:
  # Jinja2 note template. Omit to use the built-in one; to customize, copy
  # src/voxmd/templates/note.md.j2 somewhere, edit it, and point this at it.
  template: ~/.config/voxmd/note.md.j2

entities:
  # Known people and topics, e.g. {"people": ["Marco"], "topics": ["release"]}.
  # Known names become [[wikilinks]]. A missing file just means nothing is
  # linked yet; `voxmd render --update-entities` creates and extends it.
  file: ~/.config/voxmd/entities.json

  # 0-100. How similar a name must be to count as a known one. 90 merges
  # "Christopher"/"Christophor" but keeps "Marco"/"Marcus" apart.
  fuzzy_threshold: 90

vault:
  # Your Obsidian vault. Must already exist; voxmd never creates it.
  path: ~/Documents/Obsidian/Main

  # Folder inside the vault for new notes, created if missing. Omit for the
  # vault root.
  folder: Voice memos

archive:
  # Recordings move here after their note is written and verified. Created if
  # missing (its parent must exist). Omit to leave recordings where they are.
  # dir: ~/Documents/Voice memos archive

state:
  # The ledger of processed recordings, so nothing is processed twice.
  dir: ~/.local/state/voxmd

limits:
  # Rejected before any processing starts.
  max_audio_mb: 500
  max_duration_min: 180
  max_transcript_kb: 512
  max_extraction_kb: 256
  max_template_kb: 64
  max_entities_kb: 2048
  max_ledger_mb: 16

  # Timeouts. whisper's scales with audio length:
  #   max(whisper_timeout_floor_s, duration * whisper_timeout_factor)
  ffprobe_timeout_s: 30
  ffmpeg_timeout_s: 600
  whisper_timeout_floor_s: 300
  whisper_timeout_factor: 3.0

  # Whole Ollama request, model load included.
  ollama_timeout_s: 600
  ollama_connect_timeout_s: 5
