[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "voxmd"
dynamic = ["version"]
description = "Turn voice memos into linked Obsidian notes, entirely on your own machine."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rvnztolentino" }]
keywords = ["obsidian", "voice-memo", "transcription", "whisper", "ollama", "markdown", "cli"]
# macOS and Linux only: voxmd relies on fcntl locks, os.waitid and POSIX file
# modes. Keep this list in step with the README.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

# Pinned exactly, not ranged. httpx is ollama's transport and is imported
# directly (timeouts, error types), so it is pinned here too. watchdog is only
# imported by `voxmd watch`, which is why it stays out of the startup path.
dependencies = [
    "typer==0.27.2",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "ollama==0.6.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "rapidfuzz==3.14.6",
    "watchdog==6.0.0",
]

[project.urls]
Homepage = "https://github.com/rvnztolentino/voxmd"
Repository = "https://github.com/rvnztolentino/voxmd"
Issues = "https://github.com/rvnztolentino/voxmd/issues"
Changelog = "https://github.com/rvnztolentino/voxmd/blob/main/CHANGELOG.md"

[project.scripts]
voxmd = "voxmd.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.hatch.version]
path = "src/voxmd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voxmd"]

# Listed explicitly so nothing untracked in the checkout (local configs,
# memos, notes) can ever end up in a published sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/voxmd",
    "tests",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "voxmd.example.yaml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "S"]
# S603/S607 flag every subprocess call. voxmd's whole subprocess policy lives in
# safe.run (list argv, never shell=True, mandatory timeout); blanket-ignoring
# them here would defeat the point, so they are silenced only at that one call
# site with an inline noqa that explains itself.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
