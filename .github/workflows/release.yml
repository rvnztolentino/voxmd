# Publishes voxmd to PyPI with trusted publishing: no API token is stored
# anywhere. See the PyPI and TestPyPI "publisher" settings for this repo.
#
#   Push a tag vX.Y.Z  -> test, build, publish to PyPI.
#   Run it by hand     -> test, build, publish to TestPyPI only.
#
# Actions are pinned to full commit SHAs so a moved tag can't change what runs.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          enable-cache: false
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*
      - name: The installed wheel runs
        run: |
          uv venv "$RUNNER_TEMP/wheel-check"
          uv pip install --python "$RUNNER_TEMP/wheel-check" dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/voxmd" --help
      - name: Tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          installed="$("$RUNNER_TEMP/wheel-check/bin/voxmd" --version)"
          if [ "$installed" != "voxmd ${TAG#v}" ]; then
            echo "Tag $TAG does not match the built package ($installed)" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/voxmd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/voxmd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
